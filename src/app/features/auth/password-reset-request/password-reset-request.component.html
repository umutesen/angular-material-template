<div class="container login-container fx-row fx-justify-center fx-align-center">
    <form [formGroup]="form" class="fx-form-30">
        <mat-card appearance="outlined">
            <mat-card-title>angular-material-template</mat-card-title>
            <mat-card-subtitle>Reset your password</mat-card-subtitle>
            <mat-card-content>

                <mat-form-field class="full-width">
                    <input autocomplete="email" formControlName="email" id="emailInput" matInput placeholder="Email"
                           type="email">

                    @if (form.controls['email'].hasError('email')) {
                        <mat-error id="invalidEmailError">
                            Please enter a valid email address
                        </mat-error>
                    }
                    @if (form.controls['email'].hasError('required')) {
                        <mat-error id="requiredEmailError">
                            Email is
                            <strong>required</strong>
                        </mat-error>
                    }
                </mat-form-field>

            </mat-card-content>

            <mat-card-actions class="login-actions">
                <button (click)="resetPassword()" [disabled]="form.invalid || loading" color="primary" id="submit"
                        mat-raised-button>Reset Password
                </button>
                <button (click)="cancel()" id="cancel" mat-button>Cancel</button>
            </mat-card-actions>

        </mat-card>

        @if (loading) {
            <mat-progress-bar mode="indeterminate"></mat-progress-bar>
        }
    </form>
</div>
