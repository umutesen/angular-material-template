<div class="container fx-row fx-justify-center">

    <div class="fx-95">

        <mat-card appearance="outlined">
            <mat-card-content>
                <h2 i18n="@@account.content.title">My Profile</h2>

                <div class="fx-row-stack-sm">

                    <div class="fx-30-stack">
                        <app-profile-details></app-profile-details>
                    </div>

                    <div class="fx-spacer"></div>

                    <div class="fx-65-stack">

                        <mat-tab-group>
                            <mat-tab i18n-label="@@account.content.change-password.label" label="Change Password">
                                <app-change-password></app-change-password>
                            </mat-tab>
                        </mat-tab-group>

                    </div>

                </div>
            </mat-card-content>
        </mat-card>
    </div>

</div>
